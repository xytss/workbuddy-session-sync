[project]
name = 'workbuddy-session-sync'
version = '0.3.1'
description = 'WorkBuddy 本地会话跨账号接管工具'
requires-python = '>=3.12'
dependencies = ['psutil>=7.0,<8']

[project.scripts]
workbuddy-sync = 'workbuddy_sync.cli:main'

[dependency-groups]
dev = ['pytest>=8,<10', 'ruff>=0.11']

[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[tool.hatch.build.targets.wheel]
packages = ['src/workbuddy_sync']

[tool.pytest.ini_options]
testpaths = ['tests']
addopts = '-p no:cacheprovider'

[tool.ruff]
target-version = 'py312'
line-length = 100
